services:
  postgres:
    image: postgres:15
    container_name: ecommerce-postgres-dev
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-dev-network

volumes:
  postgres_dev_data:

networks:
  ecommerce-dev-network:
    driver: bridge
